name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/platform-integration]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install SDL3 Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git make \
            pkg-config cmake ninja-build gnome-desktop-testing libasound2-dev libpulse-dev \
            libaudio-dev libjack-dev libsndio-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libudev-dev fcitx-libs-dev \
            xvfb xauth libgl1-mesa-dri

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Run static analysis
        run: |
          find src -name '*.cpp' -print0 |
          xargs -0 clang-tidy -p build --header-filter="^${GITHUB_WORKSPACE}/(src|include|tests)/"

      - name: Run tests
        env:
          SDL_VIDEO_DRIVER: x11
          SDL_AUDIO_DRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1024x768x24 +extension GLX" ctest --test-dir build --output-on-failure